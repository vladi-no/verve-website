<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verve</title>
    <meta
      name="description"
      content="Verve is a modern atelier for visual storytelling."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,800&family=Urbanist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <p class="site-tagline">A modern atelier for visual storytelling</p>

        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-menu"
          aria-label="Open site menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="menu-panel" id="site-menu" aria-label="Primary">
          <a href="./index.html" aria-current="page">Home</a>
          <a href="./portfolio.html">Image Portfolio</a>
          <a href="./about.html">About</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>

      <main id="home" class="hero-stage">
        <section class="hero-frame" aria-label="Verve introduction">
          <figure class="hero-image">
            <img
              src="./assets/img/verve-home-hero.webp"
              alt="Verve logo over a seated portrait inside an editorial interior."
              width="2796"
              height="1702"
            />
          </figure>

          <div class="hero-notes" aria-label="Studio focus">
            <p>Brand identity, web presence, and visual storytelling.</p>
            <p>vervebyoakey.com</p>
          </div>
        </section>
      </main>

      <section class="home-footer" aria-label="Site navigation">
        <div class="home-footer__intro">
          <p class="home-footer__eyebrow">Verve</p>
          <p class="home-footer__summary">
            A minimal structure for the pages already mapped from Figma.
          </p>
        </div>

        <nav class="home-footer__nav" aria-label="Home page quick links">
          <a href="./portfolio.html">Image Portfolio</a>
          <a href="./about.html">About</a>
          <a href="./contact.html">Contact</a>
        </nav>

        <div class="home-footer__contact">
          <span>Next</span>
          <a href="./contact.html">Open inquiries page</a>
        </div>
      </section>
    </div>
  </body>
</html>
